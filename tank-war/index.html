<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>坦克大战 🎀 — VibeForge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎀</text></svg>">
<base href="/tank-war/">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== 主菜单 ===== -->
<div class="sweet-home" id="mainMenu">
  <div class="home-overlay"></div>
  <div class="home-panel">
    <div class="panel-deco top-left">🌸</div>
    <div class="panel-deco top-right">🌸</div>
    <div class="panel-deco bot-left">🌟</div>
    <div class="panel-deco bot-right">🌟</div>

    <div class="home-header">
      <span class="tag">☆ かわいい ☆</span>
      <span class="tag right">TANK BATTLE</span>
    </div>

    <div class="home-icon">🎀</div>
    <h1 class="home-title">坦克大战</h1>
    <p class="home-subtitle">💕 卡哇伊坦克大作战 💕</p>

    <div class="home-divider">
      <span class="divider-line"></span>
      <span class="divider-heart">♥</span>
      <span class="divider-line"></span>
    </div>

    <div class="home-body">
      <div class="home-row">
        <span class="label">🏆 最高分</span>
        <span class="value" id="homeHighScore">—</span>
      </div>
      <div class="home-row">
        <span class="label">💖 状态</span>
        <span class="value" id="homeStatus">待命中</span>
      </div>
    </div>

    <!-- 关卡选择 -->
    <div class="home-select" id="levelSelect">
      <p class="home-instruction">✿ 选择关卡 ✿</p>
      <div class="home-levels" id="levelList">
        <!-- 由 JS 动态生成 -->
      </div>
    </div>

    <div class="home-footer">
      <button class="home-btn primary" onclick="menuStartGame()">🎮 开始游戏</button>
      <button class="home-btn" onclick="location.href='/'">🏠 返回主页</button>
    </div>

    <div class="home-footer home-tips">
      <span id="controlsHint">...</span>
    </div>
  </div>
</div>

<!-- ===== 游戏画布 ===== -->
<div class="game-wrapper" id="gameWrapper" style="display:none">
  <div class="game-area">
    <!-- HUD 顶栏（占用实际空间，不遮挡画布） -->
    <div class="hud" id="hud">
      <span class="hud-item">💖 <span id="hpDisplay">3</span></span>
      <span class="hud-item" id="levelDisplay">第1关</span>
      <span class="hud-item">⭐ <span id="scoreDisplay">0</span></span>
      <span class="hud-item">🚀 <span id="enemyCountDisplay">0</span></span>
      <span class="hud-item">🏆 <span id="bestDisplay">0</span></span>
    </div>

    <!-- 游戏画面（画布 + 叠加层） -->
    <div class="game-view">
      <!-- 关卡标题（进入时闪烁显示） -->
      <div class="level-title" id="levelTitle" style="display:none"></div>

      <canvas id="gameCanvas" width="480" height="640"></canvas>

      <!-- 暂停遮罩 -->
      <div class="overlay" id="pauseOverlay" style="display:none">
        <div class="overlay-box">
          <div class="overlay-icon">💤</div>
          <h2>游戏暂停</h2>
          <p>按 <strong>ESC</strong> 或 <strong>P</strong> 继续</p>
          <button class="home-btn" onclick="quitGame()" style="margin-top:12px">🚪 退出游戏</button>
      </div>

      <!-- 过关弹窗 -->
      <div class="overlay" id="levelOverlay" style="display:none">
        <div class="overlay-box">
          <div class="overlay-icon" id="levelOverlayIcon">🎉</div>
          <h2 id="levelOverlayTitle">关卡通过！</h2>
          <div id="levelOverlayInfo"></div>
          <button class="home-btn primary" onclick="nextLevel()">🚀 进入下一关</button>
          <button class="home-btn" onclick="quitGame()">🚪 退出游戏</button>
        </div>
      </div>

      <!-- 游戏结束遮罩 -->
      <div class="overlay" id="gameOverOverlay" style="display:none">
        <div class="overlay-box">
          <div class="overlay-icon" id="gameOverIcon">💔</div>
          <h2 id="gameOverTitle">游戏结束</h2>
          <div id="gameOverInfo"></div>
          <button class="home-btn primary" onclick="menuRestart()">🔄 再试一次</button>
          <button class="home-btn" onclick="backToMenu()">🏠 返回主页</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 移动端方向键（视口底部，画布外） -->
  <div class="mobile-dpad" id="mobileDpad">
    <div class="dpad-row">
      <button class="dpad-btn" ontouchstart="movePlayerDir(0,-1)" onmousedown="movePlayerDir(0,-1)" ontouchend="stopPlayerMove()" onmouseup="stopPlayerMove()">▲</button>
    </div>
    <div class="dpad-row">
      <button class="dpad-btn" ontouchstart="movePlayerDir(-1,0)" onmousedown="movePlayerDir(-1,0)" ontouchend="stopPlayerMove()" onmouseup="stopPlayerMove()">◀</button>
      <button class="dpad-btn fire" ontouchstart="playerFire()" onmousedown="playerFire()">●</button>
      <button class="dpad-btn" ontouchstart="movePlayerDir(1,0)" onmousedown="movePlayerDir(1,0)" ontouchend="stopPlayerMove()" onmouseup="stopPlayerMove()">▶</button>
    </div>
    <div class="dpad-row">
      <button class="dpad-btn" ontouchstart="movePlayerDir(0,1)" onmousedown="movePlayerDir(0,1)" ontouchend="stopPlayerMove()" onmouseup="stopPlayerMove()">▼</button>
    </div>
  </div>
</div>

<script src="js/constants.js"></script>
<script src="js/game.js"></script>
<script src="js/renderer.js"></script>
<script src="js/input.js"></script>
<script src="js/app.js"></script>
</body>
</html>
