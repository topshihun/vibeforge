<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 — VibeForge</title>
<base href="/snake/">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 主菜单 -->
<div class="main-menu" id="mainMenu">
  <div class="menu-content">
    <div class="menu-logo">🐍</div>
    <h1 class="menu-title">贪吃蛇</h1>
    <p class="menu-subtitle">经典再现 · 全新玩法</p>
    <button class="menu-start-btn" onclick="menuStartGame()">开始游戏</button>
    <div class="menu-select">
      <div class="mode-select" id="modeSelect">
        <h2>选择模式</h2>
        <div class="mode-cards">
          <div class="mode-card selected" data-mode="classic" onclick="selectMode('classic')">
            <div class="icon">🏔️</div>
            <div class="name">经典模式</div>
            <div class="desc">撞墙即死，传统玩法</div>
          </div>
          <div class="mode-card" data-mode="wrap" onclick="selectMode('wrap')">
            <div class="icon">🌀</div>
            <div class="name">穿墙模式</div>
            <div class="desc">可穿墙从对面出现</div>
          </div>
          <div class="mode-card" data-mode="dual" onclick="selectMode('dual')">
            <div class="icon">👥</div>
            <div class="name">双人模式</div>
            <div class="desc">两蛇同场竞技</div>
          </div>
        </div>
      </div>
    </div>
    <p style="margin-top:20px;font-size:0.8em;color:#555">
      <a href="../" style="color:#667;text-decoration:none;">← 返回 VibeForge</a>
    </p>
  </div>
</div>

<!-- 游戏区域（游戏进行中才显示） -->
<div class="game-area" id="gameArea" style="display:none">
  <div class="game-container">
    <h1>🐍 贪吃蛇</h1>

    <!-- 信息栏 -->
    <div class="info-bar" id="infoBar">
      <span class="score" id="scoreP1">得分: 0</span>
      <span class="best">最高: <span id="best">0</span></span>
      <span class="score p2-color" id="scoreP2" style="display:none">P2 得分: 0</span>
    </div>

    <!-- 画布 & 覆盖层 -->
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div class="overlay" id="gameOverOverlay">
        <h2 id="gameOverTitle">游戏结束</h2>
        <div id="gameOverInfo"></div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button onclick="startGame()">再来一局</button>
          <button onclick="backToMenu()" style="background:#2a3a5c;color:#eee">返回主菜单</button>
        </div>
      </div>
      <div class="overlay" id="pauseOverlay">
        <h2 style="color:#00ff88">⏸ 暂停</h2>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button onclick="togglePause()">继续游戏</button>
          <button onclick="backToMenu()" style="background:#2a3a5c;color:#eee">返回主菜单</button>
        </div>
      </div>
    </div>

    <!-- 控制提示 -->
    <div class="controls" id="controlsHint"></div>

    <!-- 移动端按钮 -->
    <div class="mobile-controls">
      <div>
        <button onclick="setDirection(0, -1)">↑</button>
      </div>
      <div>
        <button onclick="setDirection(-1, 0)">←</button>
        <button onclick="setDirection(0, 1)">↓</button>
        <button onclick="setDirection(1, 0)">→</button>
      </div>
    </div>
  </div>
</div>

<!-- JS 模块（顺序依赖） -->
<script src="js/constants.js"></script>
<script src="js/game.js"></script>
<script src="js/renderer.js"></script>
<script src="js/input.js"></script>
<script src="js/app.js"></script>
</body>
</html>
