<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steam 价格查询 — VibeForge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💲</text></svg>">
<base href="/steam-price/">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-layout">

  <!-- ===== 左侧边栏 ===== -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo">💲</div>
      <h1 class="title">Steam 价格查询</h1>
      <p class="subtitle">多币种 · 史低追踪</p>
      <a href="../" class="back-link">← 返回 VibeForge</a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">搜索语言</div>
      <div class="lang-tags" id="langTags"></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">货币选择</div>
      <div class="currency-tags" id="currencyTags">
        <button class="currency-tag active" data-cc="cn">🇨🇳 CNY</button>
        <button class="currency-tag" data-cc="us">🇺🇸 USD</button>
        <button class="currency-tag" data-cc="de">🇪🇺 EUR</button>
        <button class="currency-tag" data-cc="jp">🇯🇵 JPY</button>
        <button class="currency-tag" data-cc="gb">🇬🇧 GBP</button>
        <button class="currency-tag" data-cc="kr">🇰🇷 KRW</button>
        <button class="currency-tag" data-cc="ru">🇷🇺 RUB</button>
        <button class="currency-tag" data-cc="br">🇧🇷 BRL</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">推荐游戏</div>
      <div class="featured-tabs" id="featuredTabs">
        <button class="featured-tab active" data-category="top_sellers">🌟 热门游戏</button>
        <button class="featured-tab" data-category="specials">🏷️ 打折游戏</button>
      </div>
    </div>
  </aside>

  <!-- ===== 右侧主区域 ===== -->
  <main class="main-area">

    <!-- 搜索栏（固定顶部） -->
    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="输入游戏名称搜索..." autocomplete="off" spellcheck="false">
      <button class="btn btn-primary" id="searchBtn">🔍 搜索</button>
    </div>

    <!-- 加载状态 -->
    <div class="loading" id="loading" style="display:none;">
      <div class="spinner"></div>
      <span>正在查询中，请稍候...</span>
    </div>

    <!-- 错误提示 -->
    <div class="error-card" id="errorCard" style="display:none;">
      <div class="error-icon">⚠️</div>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <!-- 结果区（可滚动） -->
    <div class="results" id="results"></div>

  </main>

</div>

<script src="app.js"></script>
</body>
</html>
