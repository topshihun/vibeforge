<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — VibeForge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<base href="/2048/">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 主菜单 -->
<div class="main-menu" id="mainMenu">
  <div class="menu-content">
    <div class="menu-logo">🎮</div>
    <h1 class="menu-title">2048</h1>
    <p class="menu-subtitle">合并数字 · 挑战 2048</p>
    <button class="menu-start-btn" onclick="menuStartGame()">开始游戏</button>
    <div class="menu-controls-hint">
      方向键滑动 · 触屏可滑
    </div>
    <a href="/" class="menu-home-link">🏠 返回主页</a>
  </div>
</div>

<!-- 游戏界面 -->
<div class="game-container" id="gameContainer" style="display:none">
  <div class="game-header">
    <button class="home-btn" onclick="backToMenu()" title="返回菜单">🏠</button>
    <div class="score-box">
      <div class="score-label">分数</div>
      <div class="score-value" id="score">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">最高分</div>
      <div class="score-value" id="bestScore">0</div>
    </div>
    <button class="restart-btn" onclick="restartGame()">↻ 新局</button>
  </div>

  <div class="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- 达到 2048 弹窗 -->
  <div class="overlay" id="winOverlay" style="display:none">
    <div class="overlay-content">
      <div class="overlay-icon">🎉</div>
      <h2>恭喜达到 2048！</h2>
      <p>太厉害了！你还可以继续挑战更高分数</p>
      <button onclick="continueGame()">继续挑战</button>
      <button class="btn-secondary" onclick="restartGame()">重新开始</button>
      <button class="btn-secondary" onclick="backToMenu()">返回菜单</button>
    </div>
  </div>

  <!-- 游戏结束弹窗 -->
  <div class="overlay" id="gameOverOverlay" style="display:none">
    <div class="overlay-content">
      <div class="overlay-icon">💥</div>
      <h2>游戏结束</h2>
      <p>最终分数：<strong id="finalScore">0</strong></p>
      <p>最高记录：<strong id="finalBest">0</strong></p>
      <button onclick="restartGame()">再来一局</button>
      <button class="btn-secondary" onclick="backToMenu()">返回菜单</button>
    </div>
  </div>
</div>

<!-- JS 模块（顺序依赖） -->
<script src="js/constants.js"></script>
<script src="js/game.js"></script>
<script src="js/renderer.js"></script>
<script src="js/input.js"></script>
<script src="js/app.js"></script>
</body>
</html>
