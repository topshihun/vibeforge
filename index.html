<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeForge — 创意工坊</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: 'Microsoft YaHei', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(98, 0, 255, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(0, 200, 255, 0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 40px 24px 20px;
    text-align: center;
  }
  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .logo-icon {
    font-size: 2.8em;
    line-height: 1;
    filter: drop-shadow(0 0 20px rgba(130, 87, 229, 0.5));
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .logo-text {
    font-size: clamp(2em, 6vw, 3.2em);
    font-weight: 800;
    background: linear-gradient(135deg, #8257e5, #00c8ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }
  .tagline {
    font-size: clamp(0.9em, 2vw, 1.1em);
    color: #666;
    letter-spacing: 6px;
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    font-size: 0.8em;
    color: #888;
    border-top: 1px solid rgba(130, 87, 229, 0.1);
  }
  footer .author-info a {
    color: #60a5fa;
    text-decoration: none;
  }
  footer .author-info a:hover {
    color: #93c5fd;
    text-decoration: underline;
  }

  /* ===== 工具栏 ===== */
  .toolbar {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
    padding: 12px 20px 0;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }
  .search-box {
    flex: 1;
    min-width: 200px;
    max-width: 360px;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid rgba(130, 87, 229, 0.25);
    background: rgba(20, 20, 40, 0.7);
    color: #e0e0e0;
    font-size: 0.9em;
    outline: none;
    backdrop-filter: blur(8px);
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: rgba(130, 87, 229, 0.7); }
  .search-box::placeholder { color: #555; }
  .tag-filter {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(130, 87, 229, 0.2);
    background: transparent;
    color: #888;
    font-size: 0.8em;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tag-filter:hover { border-color: rgba(130, 87, 229, 0.5); color: #bbb; }
  .tag-filter.active {
    background: rgba(130, 87, 229, 0.2);
    border-color: rgba(130, 87, 229, 0.6);
    color: #c4b5fd;
  }
  .result-count {
    font-size: 0.8em;
    color: #555;
    white-space: nowrap;
  }

  /* ===== 项目网格 ===== */
  .projects {
    position: relative;
    z-index: 1;
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    padding: 20px 20px 60px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    align-content: start;
  }

  .project-card {
    background: linear-gradient(145deg, rgba(30, 30, 60, 0.7), rgba(20, 20, 40, 0.9));
    border: 1px solid rgba(130, 87, 229, 0.15);
    border-radius: 12px;
    padding: 16px 10px 14px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    backdrop-filter: blur(8px);
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .project-card:hover {
    border-color: rgba(130, 87, 229, 0.5);
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(130, 87, 229, 0.12);
    z-index: 2;
  }
  .project-card.hidden {
    display: none;
  }
  .project-icon {
    font-size: 2em;
    line-height: 1;
    filter: drop-shadow(0 0 10px rgba(130, 87, 229, 0.25));
  }
  .project-name {
    font-size: 0.9em;
    font-weight: 700;
    color: #ddd;
  }
  .project-card .project-desc {
    font-size: 0.72em;
    color: #666;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .project-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    margin-top: 2px;
  }
  .project-tag {
    font-size: 0.65em;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(130, 87, 229, 0.12);
    color: #8877cc;
    white-space: nowrap;
  }

  @media (max-width: 600px) {
    header { padding: 28px 16px 12px; }
    .toolbar { padding: 10px 12px 0; }
    .projects {
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      padding: 16px 12px 40px;
    }
    .project-card { padding: 14px 8px 12px; }
  }
</style>
</head>
<body>

<!-- 页头 -->
<div id="header-placeholder"></div>

<!-- 工具栏 -->
<div class="toolbar" id="toolbar">
  <input class="search-box" id="searchBox" type="text" placeholder="🔍 搜索项目..." autocomplete="off">
  <div id="tagFilters"></div>
  <span class="result-count" id="resultCount"></span>
</div>

<!-- 项目网格 -->
<div class="projects" id="projectsContainer"></div>

<!-- 页脚 -->
<div id="footer-placeholder"></div>

<script>
  // ===== 全局状态 =====
  let allProjects = [];
  let activeTag = null;

  // ===== 加载组件 =====
  async function loadComponent(id, url) {
    const res = await fetch(url);
    const html = await res.text();
    document.getElementById(id).outerHTML = html;
  }

  // ===== 渲染标签筛选按钮 =====
  function renderTagFilters() {
    const tagSet = new Set();
    allProjects.forEach(p => (p.tags || []).forEach(t => tagSet.add(t)));
    const tags = [...tagSet].sort();
    const el = document.getElementById('tagFilters');
    if (tags.length === 0) { el.innerHTML = ''; return; }
    el.innerHTML = tags.map(t =>
      `<button class="tag-filter" data-tag="${t}">${t}</button>`
    ).join('');
    el.querySelectorAll('.tag-filter').forEach(btn => {
      btn.addEventListener('click', () => {
        const tag = btn.dataset.tag;
        if (activeTag === tag) {
          activeTag = null;
          btn.classList.remove('active');
        } else {
          activeTag = tag;
          el.querySelectorAll('.tag-filter').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        }
        applyFilters();
      });
    });
  }

  // ===== 筛选逻辑 =====
  function applyFilters() {
    const query = document.getElementById('searchBox').value.toLowerCase().trim();
    const cards = document.querySelectorAll('.project-card');
    let visible = 0;
    cards.forEach(card => {
      const name = card.dataset.name || '';
      const desc = card.dataset.desc || '';
      const tags = card.dataset.tags || '';
      const matchSearch = !query || name.includes(query) || desc.includes(query) || tags.includes(query);
      const matchTag = !activeTag || tags.split(',').includes(activeTag);
      if (matchSearch && matchTag) {
        card.classList.remove('hidden');
        visible++;
      } else {
        card.classList.add('hidden');
      }
    });
    document.getElementById('resultCount').textContent =
      visible === allProjects.length ? `${allProjects.length} 个项目` : `${visible} / ${allProjects.length}`;
  }

  // ===== 加载项目数据 =====
  async function loadProjects() {
    const res = await fetch('/components/projects.json');
    const data = await res.json();
    allProjects = data.projects;

    const container = document.getElementById('projectsContainer');
    container.innerHTML = allProjects.map(p => `
      <a class="project-card" href="${p.id}/"
         data-name="${p.name.toLowerCase()}"
         data-desc="${(p.desc || '').toLowerCase()}"
         data-tags="${(p.tags || []).join(',')}">
        <span class="project-icon">${p.icon}</span>
        <span class="project-name">${p.name}</span>
        ${p.desc ? `<span class="project-desc">${p.desc}</span>` : ''}
        ${p.tags && p.tags.length ? `<span class="project-tags">${p.tags.map(t => `<span class="project-tag">${t}</span>`).join('')}</span>` : ''}
      </a>
    `).join('');

    renderTagFilters();
    document.getElementById('resultCount').textContent = `${allProjects.length} 个项目`;
    document.getElementById('searchBox').addEventListener('input', applyFilters);
  }

  Promise.all([
    loadComponent('header-placeholder', '/components/header.html'),
    loadComponent('footer-placeholder', '/components/footer.html'),
    loadProjects()
  ]);
</script>

</body>
</html>
